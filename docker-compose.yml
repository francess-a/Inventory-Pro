version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hotel_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  hotel-api:
    build: ./inventory-app/hotel-api
    container_name: hotel-inventory-api
    restart: always
    ports:
      - "5100:5100"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/hotel_inventory
      - JWT_SECRET=inventory-secret
    depends_on:
      - postgres

  backend:
    build: ./inventory-app/backend
    container_name: inventory-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/inventory
    depends_on:
      - mongo

  frontend:
    build: ./inventory-app/frontend
    container_name: inventory-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
      - hotel-api

volumes:
  mongo_data:
  postgres_data:
