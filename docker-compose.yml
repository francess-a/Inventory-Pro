version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hotel_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # API and web app in one container: http://localhost:5100
  app:
    build: ./inventory-app
    container_name: hotel-inventory
    restart: always
    ports:
      - "5100:5100"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/hotel_inventory
      - JWT_SECRET=change-me-in-production
    depends_on:
      - postgres

volumes:
  postgres_data:
