name: Manual Restore
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nightly-backup
      - name: Restore PostgreSQL
        run: pg_restore --clean --if-exists --no-owner --dbname="${{ secrets.DATABASE_URL }}" backup.dump
