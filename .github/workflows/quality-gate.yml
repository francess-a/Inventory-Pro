name: Quality Gate
on:
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotel_inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Unit + end-to-end API tests; fails if line coverage of server code is below 80%.
      - name: Server tests with coverage
        working-directory: inventory-app/server
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hotel_inventory_test
        run: |
          npm ci
          npx prisma generate
          npm run test:coverage
      - name: Frontend build
        working-directory: inventory-app/frontend
        env:
          CI: true
        run: |
          npm ci
          npm run build
