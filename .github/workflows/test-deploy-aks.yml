name: Test & Deploy to AKS with Helm

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotel_inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Server: unit tests plus end-to-end API tests against PostgreSQL
      - name: Server tests
        working-directory: inventory-app/server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hotel_inventory_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hotel_inventory_test
        run: |
          npm ci
          npx prisma generate
          npm test

      # Web app: production build with lint errors treated as failures
      - name: Frontend build
        working-directory: inventory-app/frontend
        env:
          CI: true
        run: |
          npm ci
          npm run build

      # Single application image (API + web app)
      - name: Docker image build
        run: docker build -t hotel-inventory:ci inventory-app

  deploy:
    runs-on: ubuntu-latest
    needs: test   # Only run if tests and builds pass
    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Get AKS credentials
      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_AKS_CLUSTER }} \
            --overwrite-existing

      # Install Helm
      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # Helm upgrade
      - name: Helm Upgrade
        run: |
          helm upgrade --install inventory ./helm/inventory \
            --set image.backend=${{ secrets.ACR_LOGIN_SERVER }}/inventory-backend:latest \
            --set image.frontend=${{ secrets.ACR_LOGIN_SERVER }}/inventory-frontend:latest \
            --set ingress.host=${{ secrets.INVENTORY_HOST }}
