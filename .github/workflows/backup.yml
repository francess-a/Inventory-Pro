name: Nightly Backup
on:
  schedule:
    - cron: "0 0 * * *"
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump PostgreSQL
        run: pg_dump --format=custom --no-owner --file=backup.dump "${{ secrets.DATABASE_URL }}"
      - name: Upload Backup
        uses: actions/upload-artifact@v4
        with:
          name: nightly-backup
          path: backup.dump
