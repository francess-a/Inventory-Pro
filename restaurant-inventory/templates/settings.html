{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="pagehead"><h1>Settings</h1></div>
<div class="two">
<section><h2>Stock calculations</h2>
<form method="post" class="panel stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% for key, (label, help) in labels.items() %}
    <label>{{ label }} <input type="number" step="any" min="0" name="{{ key }}" value="{{ values[key]|qty|replace(',', '') }}" required><small>{{ help }}</small></label>
  {% endfor %}
  <button>Save settings</button>
</form></section>
<section><h2>Departments</h2>
<div class="panel stack">
  <ul class="plain">
  {% for d in departments %}
    <li>{{ d }}
      <form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="form" value="remove_department"><input type="hidden" name="name" value="{{ d }}"><button class="link danger">Remove</button></form></li>
  {% endfor %}
  </ul>
  <form method="post" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="form" value="department">
    <label class="grow">New department <input name="name" required></label><button>Add</button>
  </form>
</div></section>
</div>
{% endblock %}
