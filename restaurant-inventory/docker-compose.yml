services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: inv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: inventory
    volumes:
      - inventory_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inv -d inventory"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://inv:${POSTGRES_PASSWORD}@db:5432/inventory
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      APP_PASSWORD: ${APP_PASSWORD:-}
    ports:
      - "8000:8000"

volumes:
  inventory_db:
